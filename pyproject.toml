[build-system]
requires = [ "setuptools", "setuptools_scm" ]
build-backend = "setuptools.build_meta"

[project]
name = "ts-criopy"
description = "LSST cRIO utilities - M1M3 and VMS EUIs."
license = { text = "GPL" }
classifiers = [ "Programming Language :: Python :: 3" ]
urls = { documentation = "https://ts-criopy.lsst.io", repository = "https://github.com/lsst-ts/ts_criopy" }
dynamic = [ "version" ]
dependencies = [
  "astropy",
  "numpy>=1.4",
  "pandas",
  "pyside6",
  "pyyaml",
  "qasync",
  "moto",
  "boto3",
  "click",
  "jsonschema",
  "ts_idl",
  "ts_m1m3_utils",
  "ts_salobj",
  "ts_xml",
  "ts_utils",
  "lsst_efd_client",
]

[tool.setuptools.dynamic]
version = { attr = "setuptools_scm.get_version" }

[tool.setuptools.packages.find]
where = [ "python" ]

[project.scripts]
M1M3GUI = "lsst.ts.criopy.m1m3gui:run"
M1M3SIMGUI = "lsst.ts.criopy.m1m3simgui:run"
M1M3TSGUI = "lsst.ts.criopy.m1m3tsgui:run"
VMSGUI = "lsst.ts.criopy.vmsgui:run"

[tool.setuptools_scm]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[project.optional-dependencies]
dev = ["documenteer[pipelines]"]
